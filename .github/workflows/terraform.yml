name: terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"

# One run per PR (or per branch on push). A newer push cancels the older run so
# two applies never race on the same state.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing at workflow level, each job asks only for what it needs.
permissions: {}

jobs:
  staging:
    permissions:
      id-token: write # OIDC to AWS (plan/apply)
      contents: read
      pull-requests: write # sticky plan comment
    uses: adrianabelgarcia/aws-iac-foundations/.github/workflows/terraform.yml@e726b540430d11d706d6d360e371f4a648335c4d # v1
    with:
      working-directory: terraform/envs/staging
      environment: staging
      aws-region: us-east-1
      aws-role-arn: ${{ vars.AWS_ROLE_ARN_STAGING }}
      apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  prod:
    needs: staging
    permissions:
      id-token: write # OIDC to AWS (plan/apply)
      contents: read
      pull-requests: write # sticky plan comment
    uses: adrianabelgarcia/aws-iac-foundations/.github/workflows/terraform.yml@e726b540430d11d706d6d360e371f4a648335c4d # v1
    with:
      working-directory: terraform/envs/prod
      environment: prod
      aws-region: us-east-1
      aws-role-arn: ${{ vars.AWS_ROLE_ARN_PROD }}
      apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
