name: gitops

# Validates the GitOps tree without any AWS access. Argo CD does the deployment;
# this workflow only proves the manifests render, match the Kubernetes and CRD
# schemas, and satisfy the admission policies.

on:
  pull_request:
    paths:
      - "gitops/**"
      - "scripts/validate-gitops.sh"
      - ".yamllint.yaml"
      - ".github/workflows/gitops.yml"
  push:
    branches:
      - main
    paths:
      - "gitops/**"
      - "scripts/validate-gitops.sh"
      - ".yamllint.yaml"
      - ".github/workflows/gitops.yml"

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: "5.8.3"
  KUBECONFORM_VERSION: "0.8.0"
  KYVERNO_VERSION: "1.20.0"
  YAMLLINT_VERSION: "1.38.0"
  K8S_VERSION: "1.34.0"

jobs:
  validate:
    name: render, schema, policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tgz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install Kyverno CLI
        run: |
          curl -fsSL -o kyverno.tgz \
            "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tgz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Install yamllint
        run: pip install --quiet "yamllint==${YAMLLINT_VERSION}"

      - name: Validate GitOps tree
        env:
          K8S_VERSION: ${{ env.K8S_VERSION }}
        run: ./scripts/validate-gitops.sh
