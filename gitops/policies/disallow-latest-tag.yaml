# Images must be pinned to an explicit tag or digest. An untagged image or the
# mutable :latest tag makes rollbacks and audits impossible.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Mutable or implicit image tags break reproducible deployments and
      rollbacks. Use an immutable version tag or a digest.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kyverno", "argocd", "monitoring", "external-dns"]
  variables:
    # Controllers keep their pod template under spec.template; bare Pods do not.
    - name: podSpec
      expression: "has(object.spec.template) ? object.spec.template.spec : object.spec"
    - name: containers
      expression: "variables.podSpec.containers"
  validations:
    # A digest pins the image. Otherwise the last path segment must carry an
    # explicit tag, and that tag must not be "latest". The path-segment check
    # stops a registry port such as host:5000/app from counting as a tag.
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@') ||
          (c.image.split('/')[size(c.image.split('/')) - 1].contains(':') &&
           !c.image.endsWith(':latest')))
      message: "Images must use an explicit tag other than latest, or a digest."
