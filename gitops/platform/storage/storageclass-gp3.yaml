# Default EKS storage is gp2. This StorageClass adds encrypted gp3 volumes
# provisioned by the EBS CSI driver. It is intentionally not the default class,
# so workloads opt in explicitly and gp2 keeps working for existing PVCs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
