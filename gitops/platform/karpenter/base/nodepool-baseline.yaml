# Stable baseline capacity, on-demand only. Used for workloads that must not
# be interrupted by Spot reclamation. Consolidation is slower and disruption is
# capped to one node at a time.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: baseline
spec:
  template:
    metadata:
      labels:
        workload.acme-demo.dev/pool: baseline
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: bottlerocket
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium"]
      expireAfter: 336h
      terminationGracePeriod: 2h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 15m
    budgets:
      - nodes: "1"
  limits:
    cpu: "64"
    memory: 256Gi
