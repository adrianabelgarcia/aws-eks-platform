apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared Karpenter capacity definitions. Each environment overlay supplies the
# cluster-specific IAM role and discovery selectors, plus the pool weights and
# disruption budgets that differ between staging and prod.
resources:
  - ec2nodeclass.yaml
  - nodepool-general.yaml
  - nodepool-baseline.yaml
