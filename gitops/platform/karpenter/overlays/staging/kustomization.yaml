apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ec2nodeclass-patch.yaml
    target:
      kind: EC2NodeClass
      name: bottlerocket
  - path: nodepool-general-patch.yaml
    target:
      kind: NodePool
      name: general
  - path: nodepool-baseline-patch.yaml
    target:
      kind: NodePool
      name: baseline
