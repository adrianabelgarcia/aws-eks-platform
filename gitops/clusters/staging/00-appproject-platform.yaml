apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Platform components and the sample workload for the acme-staging cluster.
  sourceRepos:
    - https://github.com/adrianabelgarcia/aws-eks-platform.git
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: sample-api
  # Cluster-scoped kinds are allowed because platform charts install CRDs,
  # ClusterRoles and webhooks. Narrowing this list is tracked in README "What I'd do next".
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
