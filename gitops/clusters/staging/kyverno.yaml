# Kyverno admission controller. Policies live in gitops/policies (wave 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: "3.10.0"
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController:
          replicas: 2
          nodeSelector:
            node-role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        backgroundController:
          nodeSelector:
            node-role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        cleanupController:
          nodeSelector:
            node-role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        reportsController:
          nodeSelector:
            node-role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
