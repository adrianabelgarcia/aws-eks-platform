apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-api

labels:
  - pairs:
      app.kubernetes.io/name: sample-api
      app.kubernetes.io/part-of: aws-eks-platform
    includeSelectors: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - ingress.yaml
