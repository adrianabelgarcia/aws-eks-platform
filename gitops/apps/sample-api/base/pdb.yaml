apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-api
  labels:
    app.kubernetes.io/component: api
spec:
  # Node drains (Karpenter consolidation, AMI rollouts, EKS upgrades) may
  # evict at most one replica at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
