apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/acme-demo/sample-api
    newTag: 1.4.2

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: sample-api
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: sample-api
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: sample-api
  - path: ingress-host-patch.yaml
    target:
      kind: Ingress
      name: sample-api
